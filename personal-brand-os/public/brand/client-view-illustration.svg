<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d">
  <title id="t">Personal Brand OS — client view</title>
  <desc id="d">The client-facing month in Personal Brand OS: the content, the schedule, and what the client needs to supply. Illustrative client and figures.</desc>

  <defs>
    <style>
      .f    { font-family: 'Outfit', ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; }
      .med  { font-weight: 500; }
      .ink  { fill: #eef2f9; }
      .soft { fill: #a9b3c6; }
      .faint{ fill: #6e7a8f; }
      .acc  { fill: #21c9e0; }
    </style>
    <radialGradient id="au1" cx="75%" cy="-6%" r="62%">
      <stop offset="0%" stop-color="#21c9e0" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#21c9e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="au2" cx="3%" cy="-4%" r="58%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="au3" cx="92%" cy="108%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- near-black navy ground with the aurora -->
  <rect width="1200" height="840" fill="#060b17"/>
  <rect width="1200" height="840" fill="url(#au1)"/>
  <rect width="1200" height="840" fill="url(#au2)"/>
  <rect width="1200" height="840" fill="url(#au3)"/>

  <!-- ============ header ============ -->
  <text x="64" y="80" class="f acc" font-size="11" letter-spacing="0.14em">YOUR MONTH</text>
  <text x="64" y="120" class="f med ink" font-size="30" letter-spacing="-0.01em">Rowan Fielding — October 2026</text>

  <rect x="530" y="97" width="84" height="24" rx="12" fill="#12351f"/>
  <text x="572" y="113" class="f med" font-size="11" fill="#57d97f" text-anchor="middle" letter-spacing="0.04em">Approved</text>

  <text x="64" y="145" class="f soft" font-size="13.5">Signed off 28 September · revision 2 · 14 pieces · 38 posts</text>

  <!-- ============ stat strip ============ -->
  <rect x="64" y="172" width="1072" height="86" rx="8" fill="#1a253c" stroke="#24384f"/>
  <line x1="332" y1="196" x2="332" y2="234" stroke="#24384f"/>
  <line x1="600" y1="196" x2="600" y2="234" stroke="#24384f"/>
  <line x1="868" y1="196" x2="868" y2="234" stroke="#24384f"/>

  <text x="96" y="204" class="f soft" font-size="11.5">Planned posts</text>
  <text x="96" y="238" class="f med ink" font-size="27">38</text>

  <text x="364" y="204" class="f soft" font-size="11.5">Production-ready</text>
  <text x="364" y="238" class="f med" font-size="27" fill="#57d97f">31</text>

  <text x="632" y="204" class="f soft" font-size="11.5">Waiting on you</text>
  <text x="632" y="238" class="f med" font-size="27" fill="#f2c14e">7</text>

  <text x="900" y="204" class="f soft" font-size="11.5">First publish</text>
  <text x="900" y="238" class="f med ink" font-size="27">2 Oct</text>

  <!-- ============ left column ============ -->
  <text x="64" y="300" class="f med ink" font-size="14">The content</text>

  <!-- card 1 -->
  <g>
    <rect x="64" y="316" width="676" height="158" rx="8" fill="#131c2f" stroke="#24384f"/>
    <text x="88" y="346" class="f med ink" font-size="16">What nobody tells you about scaling</text>
    <text x="716" y="346" class="f faint" font-size="12" text-anchor="end">6 Oct</text>
    <text x="88" y="372" class="f soft" font-size="13">A piece on why the systems that got you to ten people quietly stop</text>
    <text x="88" y="391" class="f soft" font-size="13">working at thirty — and what to rebuild first.</text>
    <rect x="88" y="406" width="2" height="22" fill="#21c9e0"/>
    <text x="102" y="422" class="f faint" font-size="12.5" font-style="italic">“We kept hiring to fix a process problem.”</text>

    <rect x="88" y="440" width="118" height="22" rx="11" fill="#1a253c" stroke="#24384f"/>
    <text x="147" y="455" class="f soft" font-size="10.5" text-anchor="middle">LinkedIn · text</text>
    <rect x="214" y="440" width="130" height="22" rx="11" fill="#1a253c" stroke="#24384f"/>
    <text x="279" y="455" class="f soft" font-size="10.5" text-anchor="middle">YouTube · short</text>
    <rect x="352" y="440" width="130" height="22" rx="11" fill="#1a253c" stroke="#24384f"/>
    <text x="417" y="455" class="f soft" font-size="10.5" text-anchor="middle">Instagram · reel</text>
  </g>

  <!-- card 2 — carries an ask -->
  <g>
    <rect x="64" y="486" width="676" height="184" rx="8" fill="#131c2f" stroke="#24384f"/>
    <text x="88" y="516" class="f med ink" font-size="16">The hire I got wrong</text>
    <text x="716" y="516" class="f faint" font-size="12" text-anchor="end">13 Oct</text>
    <text x="88" y="542" class="f soft" font-size="13">An honest account of a senior hire that didn’t work, and the three</text>
    <text x="88" y="561" class="f soft" font-size="13">questions we now ask before anyone joins.</text>

    <rect x="88" y="578" width="118" height="22" rx="11" fill="#1a253c" stroke="#24384f"/>
    <text x="147" y="593" class="f soft" font-size="10.5" text-anchor="middle">LinkedIn · text</text>
    <rect x="214" y="578" width="146" height="22" rx="11" fill="#1a253c" stroke="#24384f"/>
    <text x="287" y="593" class="f soft" font-size="10.5" text-anchor="middle">Podcast · episode</text>

    <rect x="88" y="612" width="628" height="42" rx="6" fill="#3a2c0f" stroke="#7a5f1c"/>
    <text x="106" y="630" class="f med" font-size="11" fill="#f2c14e">We need this from you</text>
    <text x="106" y="647" class="f soft" font-size="12.5">The story on camera — 90 seconds, however you want to tell it.</text>
  </g>

  <!-- card 3, fading to suggest the list continues -->
  <g opacity="0.4">
    <rect x="64" y="682" width="676" height="82" rx="8" fill="#131c2f" stroke="#24384f"/>
    <text x="88" y="712" class="f med ink" font-size="16">Why we stopped chasing referrals</text>
    <text x="716" y="712" class="f faint" font-size="12" text-anchor="end">20 Oct</text>
    <text x="88" y="738" class="f soft" font-size="13">The quiet cost of a pipeline you don’t control.</text>
  </g>

  <!-- ============ right column ============ -->
  <text x="772" y="300" class="f med ink" font-size="14">This month’s objective</text>
  <rect x="772" y="316" width="364" height="88" rx="8" fill="#1a253c" stroke="#24384f"/>
  <text x="796" y="346" class="f ink" font-size="13.5">Open ten conversations with</text>
  <text x="796" y="367" class="f ink" font-size="13.5">operations directors in</text>
  <text x="796" y="388" class="f ink" font-size="13.5">manufacturing.</text>

  <text x="772" y="440" class="f med ink" font-size="14">What we need from you</text>

  <g>
    <rect x="772" y="456" width="364" height="56" rx="8" fill="#131c2f" stroke="#24384f"/>
    <rect x="772" y="456" width="3" height="56" rx="1.5" fill="#f2c14e"/>
    <text x="796" y="481" class="f ink" font-size="13">Story on camera — 90 seconds</text>
    <text x="796" y="499" class="f faint" font-size="11">For: The hire I got wrong</text>
  </g>

  <g>
    <rect x="772" y="524" width="364" height="56" rx="8" fill="#131c2f" stroke="#24384f"/>
    <rect x="772" y="524" width="3" height="56" rx="1.5" fill="#f2c14e"/>
    <text x="796" y="549" class="f ink" font-size="13">Confirm the booking link</text>
    <text x="796" y="567" class="f faint" font-size="11">For: 2 pieces</text>
  </g>

  <g>
    <rect x="772" y="592" width="364" height="56" rx="8" fill="#131c2f" stroke="#24384f"/>
    <rect x="772" y="592" width="3" height="56" rx="1.5" fill="#f2c14e"/>
    <text x="796" y="617" class="f ink" font-size="13">Three photos from the site visit</text>
    <text x="796" y="635" class="f faint" font-size="11">For: 4 pieces</text>
  </g>

  <!-- schedule -->
  <text x="772" y="694" class="f med ink" font-size="14">The schedule</text>
  <rect x="772" y="710" width="364" height="78" rx="8" fill="#1a253c" stroke="#24384f"/>
  <g class="f faint" font-size="10.5">
    <text x="804" y="734" text-anchor="middle">Mon</text>
    <text x="856" y="734" text-anchor="middle">Tue</text>
    <text x="908" y="734" text-anchor="middle">Wed</text>
    <text x="960" y="734" text-anchor="middle">Thu</text>
    <text x="1012" y="734" text-anchor="middle">Fri</text>
  </g>
  <g fill="#21c9e0">
    <rect x="792" y="746" width="24" height="6" rx="3"/>
    <rect x="896" y="746" width="24" height="6" rx="3"/>
    <rect x="1000" y="746" width="24" height="6" rx="3"/>
    <rect x="844" y="764" width="24" height="6" rx="3"/>
    <rect x="948" y="764" width="24" height="6" rx="3"/>
  </g>
  <g fill="#24384f">
    <rect x="844" y="746" width="24" height="6" rx="3"/>
    <rect x="948" y="746" width="24" height="6" rx="3"/>
    <rect x="792" y="764" width="24" height="6" rx="3"/>
    <rect x="896" y="764" width="24" height="6" rx="3"/>
    <rect x="1000" y="764" width="24" height="6" rx="3"/>
  </g>
  <text x="1112" y="754" class="f faint" font-size="11" text-anchor="end">38 posts</text>
  <text x="1112" y="770" class="f faint" font-size="11" text-anchor="end">scheduled</text>
</svg>
